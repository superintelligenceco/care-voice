[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "care-voice"
version = "0.1.0"
description = "Open-source daily voice check-in agent for older adults living alone, with caregiver alerts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "superintelligenceco contributors" }]
keywords = ["caregiving", "voice-agent", "check-in", "aging-in-place", "alerts", "telephony"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Telephony",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-benchmark>=4",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.scripts]
care-voice = "care_voice.cli:main"

[project.urls]
Homepage = "https://github.com/superintelligenceco/care-voice"
Issues = "https://github.com/superintelligenceco/care-voice/issues"
Documentation = "https://superintelligenceco.github.io/care-voice/"
Changelog = "https://github.com/superintelligenceco/care-voice/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
care_voice = ["data/*.yaml", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "packaging"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --benchmark-disable"
markers = ["slow: slower property-based and integration tests, run nightly"]

[tool.coverage.run]
source = ["care_voice"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mutmut]
# Mutation testing is scoped to the core pure logic. Run it with
# `mutmut run` or the manual "Mutation testing" workflow.
source_paths = ["src/"]
only_mutate = ["src/care_voice/extractors/rules.py", "src/care_voice/risk.py"]
pytest_add_cli_args_test_selection = [
  "tests/test_rules_extractor.py",
  "tests/test_risk.py",
  "tests/test_properties.py",
  "tests/test_engine.py",
]
