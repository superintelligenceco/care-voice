name: Release

# Builds the downloadable artifacts: the wheel and sdist, standalone `care-voice`
# executables, the release docker-compose.yml, install.sh, an SPDX SBOM, and
# SHA256SUMS. Every artifact gets a build provenance attestation.
#
# A `v*` tag publishes the wheel and sdist to PyPI, creates the GitHub Release
# for that tag with every asset attached, then installs the release with
# install.sh on each platform. A manual run (workflow_dispatch) builds and
# uploads everything as workflow run artifacts only. The container image is
# built, scanned, and signed by docker.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dist:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} does not match version ${version}"; exit 1; }
          grep -q "^## \[${version}\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for ${version}"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check the bundled check-in script is packaged
        run: |
          tar tzf dist/*.tar.gz | grep -q 'src/care_voice/data/default_script.yaml'
          python -m zipfile -l dist/*.whl | grep -q 'care_voice/data/default_script.yaml'
      - name: Smoke test the wheel
        run: |
          python -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/venv/bin/care-voice" simulate --date 2026-09-30 --db smoke.db \
            --replies "${GITHUB_WORKSPACE}/examples/replies/concerning-day.txt" | tee out.txt
          grep -q FALL_REPORTED out.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  exe-linux:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    # Debian bullseye (glibc 2.31) keeps the executables compatible with older distributions.
    container: python:3.12-slim-bullseye
    env:
      ASSET: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: care-voice-linux-x64
            runner: ubuntu-latest
          - asset: care-voice-linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq binutils
          pip install --root-user-action=ignore . pyinstaller tzdata
      - name: Build the executable
        run: python packaging/build_exe.py "${ASSET}"
      - name: Smoke test the executable
        run: |
          cd /tmp
          "${GITHUB_WORKSPACE}/dist/${ASSET}" --version
          "${GITHUB_WORKSPACE}/dist/${ASSET}" simulate --date 2026-09-30 --db smoke.db \
            --config "${GITHUB_WORKSPACE}/examples/care-voice.yaml" \
            --replies "${GITHUB_WORKSPACE}/examples/replies/concerning-day.txt" | tee out.txt
          grep -q FALL_REPORTED out.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  exe-native:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: care-voice-macos-arm64
            runner: macos-latest
            file: care-voice-macos-arm64
          - asset: care-voice-macos-x64
            runner: macos-15-intel
            file: care-voice-macos-x64
          - asset: care-voice-windows-x64
            runner: windows-latest
            file: care-voice-windows-x64.exe
    env:
      ASSET: ${{ matrix.asset }}
      FILE: ${{ matrix.file }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install . pyinstaller tzdata
      - name: Build the executable
        run: python packaging/build_exe.py "${ASSET}"
      - name: Smoke test the executable
        run: |
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/dist/${FILE}" --version
          "${GITHUB_WORKSPACE}/dist/${FILE}" simulate --date 2026-09-30 --db smoke.db \
            --config "${GITHUB_WORKSPACE}/examples/care-voice.yaml" \
            --replies "${GITHUB_WORKSPACE}/examples/replies/concerning-day.txt" | tee out.txt
          grep -q FALL_REPORTED out.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.file }}
          if-no-files-found: error

  assemble:
    name: Assemble, attest, and checksum release assets
    needs: [dist, exe-linux, exe-native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # sign the build provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Generate an SPDX SBOM for the Python package
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: assets/care-voice.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Add the compose file, install script, and checksums
        working-directory: assets
        run: |
          cp ../deploy/docker-compose.yml docker-compose.yml
          cp ../install.sh install.sh
          chmod +x care-voice-linux-x64 care-voice-linux-arm64 care-voice-macos-arm64 \
            care-voice-macos-x64 install.sh
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: care-voice-release-assets
          path: assets/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: assemble
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/care-voice/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false

  release:
    name: Create the GitHub Release
    needs: [assemble, pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: care-voice-release-assets
          path: assets
      - name: Write the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "pip install care-voice==${version}"
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | CARE_VOICE_VERSION=${TAG} sh"
            echo "docker run --rm -p 127.0.0.1:8080:8080 ghcr.io/${GITHUB_REPOSITORY}:${TAG}"
            echo '```'
            echo
            echo "Verify a download with \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`."
          } >> notes.md
          cat notes.md
      - name: Create the release and upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --notes-file notes.md
          else
            gh release create "${TAG}" --verify-tag --title "care-voice ${TAG}" --notes-file notes.md
          fi
          gh release upload "${TAG}" assets/* --clobber

  verify-install:
    name: install.sh on ${{ matrix.os }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release with install.sh and run a check-in
        env:
          CARE_VOICE_VERSION: ${{ github.ref_name }}
          CARE_VOICE_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          sh install.sh
          cd "${RUNNER_TEMP}"
          "${CARE_VOICE_INSTALL_DIR}/care-voice" --version | grep -q "${CARE_VOICE_VERSION#v}"
          "${CARE_VOICE_INSTALL_DIR}/care-voice" simulate --date 2026-09-30 --db smoke.db \
            --replies "${GITHUB_WORKSPACE}/examples/replies/concerning-day.txt" | tee out.txt
          grep -q FALL_REPORTED out.txt
