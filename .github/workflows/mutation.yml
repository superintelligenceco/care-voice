name: Mutation testing

# Weekly and on demand: mutmut mutates the rule-based extractor and the alert
# rules, then reruns the matching tests against each mutant. Surviving mutants
# point at logic the tests do not pin down. The job reports the score and fails
# when fewer than MIN_KILLED_PERCENT of the mutants are killed.

on:
  schedule:
    - cron: "12 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  MIN_KILLED_PERCENT: "80"

jobs:
  mutmut:
    name: mutmut on the extractor and rules
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" "mutmut==3.8.0"
      - name: Run mutmut
        run: mutmut run --max-children 4 > /dev/null
      - name: Summarize and check the score
        run: |
          mutmut results --all true > results.txt
          killed="$(grep -c ': killed$' results.txt || true)"
          total="$(grep -cE ': [a-z ]+$' results.txt || true)"
          score=$(( killed * 100 / total ))
          {
            echo "## Mutation testing"
            echo
            echo "Killed ${killed} of ${total} mutants (${score}%, minimum ${MIN_KILLED_PERCENT}%)."
            echo
            echo '```text'
            grep -E ': survived$' results.txt | head -n 80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "${score}" -ge "${MIN_KILLED_PERCENT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutmut-results
          path: results.txt
