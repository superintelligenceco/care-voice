name: Ship

# Builds the downloadable artifacts: the wheel and sdist, standalone `care-voice`
# executables for four platforms, the release docker-compose.yml, and SHA256SUMS.
# A `v*` tag attaches them to the GitHub Release for that tag (creating the
# release if it does not exist). A manual run (workflow_dispatch) uploads them as
# workflow run artifacts only. The container image is built by docker.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dist:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} does not match version ${version}"; exit 1; }
      - run: python -m pip install build
      - run: python -m build
      - name: Check the bundled check-in script is packaged
        run: |
          tar tzf dist/*.tar.gz | grep -q 'src/care_voice/data/default_script.yaml'
          python -m zipfile -l dist/*.whl | grep -q 'care_voice/data/default_script.yaml'
      - name: Smoke test the wheel
        run: |
          python -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/venv/bin/care-voice" simulate --date 2026-09-30 --db smoke.db \
            --replies "${GITHUB_WORKSPACE}/examples/replies/concerning-day.txt" | tee out.txt
          grep -q FALL_REPORTED out.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  exe-linux:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    # Debian bullseye (glibc 2.31) keeps the executables compatible with older distributions.
    container: python:3.12-slim-bullseye
    env:
      ASSET: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: care-voice-linux-x64
            runner: ubuntu-latest
          - asset: care-voice-linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq binutils
          pip install --root-user-action=ignore . pyinstaller tzdata
      - name: Build the executable
        run: python packaging/build_exe.py "${ASSET}"
      - name: Smoke test the executable
        run: |
          cd /tmp
          "${GITHUB_WORKSPACE}/dist/${ASSET}" --version
          "${GITHUB_WORKSPACE}/dist/${ASSET}" simulate --date 2026-09-30 --db smoke.db \
            --config "${GITHUB_WORKSPACE}/examples/care-voice.yaml" \
            --replies "${GITHUB_WORKSPACE}/examples/replies/concerning-day.txt" | tee out.txt
          grep -q FALL_REPORTED out.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  exe-native:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: care-voice-macos-arm64
            runner: macos-latest
            file: care-voice-macos-arm64
          - asset: care-voice-windows-x64
            runner: windows-latest
            file: care-voice-windows-x64.exe
    env:
      ASSET: ${{ matrix.asset }}
      FILE: ${{ matrix.file }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install . pyinstaller tzdata
      - name: Build the executable
        run: python packaging/build_exe.py "${ASSET}"
      - name: Smoke test the executable
        run: |
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/dist/${FILE}" --version
          "${GITHUB_WORKSPACE}/dist/${FILE}" simulate --date 2026-09-30 --db smoke.db \
            --config "${GITHUB_WORKSPACE}/examples/care-voice.yaml" \
            --replies "${GITHUB_WORKSPACE}/examples/replies/concerning-day.txt" | tee out.txt
          grep -q FALL_REPORTED out.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.file }}
          if-no-files-found: error

  assemble:
    name: Assemble release assets
    needs: [dist, exe-linux, exe-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Add the compose file and checksums
        working-directory: assets
        run: |
          cp ../deploy/docker-compose.yml docker-compose.yml
          chmod +x care-voice-linux-x64 care-voice-linux-arm64 care-voice-macos-arm64
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: care-voice-release-assets
          path: assets/
          if-no-files-found: error

  release:
    name: Attach assets to the GitHub Release
    needs: assemble
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: care-voice-release-assets
          path: assets
      - name: Create the release if needed and upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "${TAG}" >/dev/null 2>&1 \
            || gh release create "${TAG}" --verify-tag --title "${TAG}" --generate-notes
          gh release upload "${TAG}" assets/* --clobber
