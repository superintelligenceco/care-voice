name: Docker

# Pull requests and pushes to main build, smoke test, and scan the image without
# pushing. A `v*` tag pushes ghcr.io/superintelligenceco/care-voice:<tag> and
# :latest; a manual run (workflow_dispatch) pushes :edge. Every pushed image is
# signed with cosign (keyless) and gets an SBOM and a build provenance attestation.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/superintelligenceco/care-voice

jobs:
  build:
    name: Build, smoke test, and scan image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the Trivy SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: care-voice:ci
      - name: Smoke test the image
        run: |
          docker run --rm care-voice:ci --version
          docker run --rm care-voice:ci simulate --config /app/examples/care-voice.yaml \
            --db /tmp/smoke.db --replies /app/examples/replies/concerning-day.txt --date 2026-09-30
      - name: Smoke test the dashboard
        run: |
          docker run -d --name cv -p 127.0.0.1:8080:8080 care-voice:ci
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/alerts
          docker rm -f cv
      - name: Check docker compose files
        run: |
          docker compose config --quiet
          docker compose -f deploy/docker-compose.yml config --quiet
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: care-voice:ci
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
      - name: Upload Trivy results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: care-voice:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          skip-setup-trivy: true

  publish:
    name: Push, sign, and attest multi-arch image
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing and attestations
      attestations: write # store the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Sign the image with cosign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify the signature, then pull and smoke test the pushed image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${REPO}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          docker run -d --name cv -p 127.0.0.1:8080:8080 "${IMAGE}@${DIGEST}"
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/checkins
          docker rm -f cv
