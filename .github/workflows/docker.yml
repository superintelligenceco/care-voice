name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: care-voice:ci
      - name: Smoke test the image
        run: |
          docker run --rm care-voice:ci --version
          docker run --rm care-voice:ci simulate --config /app/examples/care-voice.yaml \
            --db /tmp/smoke.db --replies /app/examples/replies/concerning-day.txt --date 2026-09-30
      - name: Check docker compose config
        run: docker compose config --quiet
