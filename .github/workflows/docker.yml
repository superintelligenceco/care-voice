name: Docker

# Pull requests and pushes to main build and smoke test the image without pushing.
# A `v*` tag pushes ghcr.io/superintelligenceco/care-voice:<tag> and :latest.
# A manual run (workflow_dispatch) pushes :edge.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/superintelligenceco/care-voice

jobs:
  build:
    name: Build and smoke test image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: care-voice:ci
      - name: Smoke test the image
        run: |
          docker run --rm care-voice:ci --version
          docker run --rm care-voice:ci simulate --config /app/examples/care-voice.yaml \
            --db /tmp/smoke.db --replies /app/examples/replies/concerning-day.txt --date 2026-09-30
      - name: Smoke test the dashboard
        run: |
          docker run -d --name cv -p 127.0.0.1:8080:8080 care-voice:ci
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/alerts
          docker rm -f cv
      - name: Check docker compose files
        run: |
          docker compose config --quiet
          docker compose -f deploy/docker-compose.yml config --quiet

  publish:
    name: Push multi-arch image to GHCR
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Pull and smoke test the pushed image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          ref="$(echo "$TAGS" | head -n 1)"
          docker run -d --name cv -p 127.0.0.1:8080:8080 "$ref"
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/checkins
          docker rm -f cv
