name: Nightly

# The full suite every night against the newest dependency versions that the
# pyproject.toml ranges allow: every supported Python on Linux, macOS, and
# Windows, with many more Hypothesis examples, plus the benchmark gate and a
# clean, uncached container build.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: Full suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      HYPOTHESIS_PROFILE: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade -e ".[dev]"
      - name: Unit, property, README, and end-to-end tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  bench:
    name: Benchmark gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_bench.py --benchmark-enable --benchmark-only --benchmark-json=bench.json
      - run: python scripts/check_bench.py bench.json benchmarks/baseline.json

  docker:
    name: Clean container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build without cache and run a check-in
        run: |
          docker build --no-cache --pull -t care-voice:nightly .
          docker run --rm care-voice:nightly simulate --config /app/examples/care-voice.yaml \
            --db /tmp/n.db --replies /app/examples/replies/concerning-day.txt --date 2026-09-30 \
            | tee out.txt
          grep -q FALL_REPORTED out.txt
